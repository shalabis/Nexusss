<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com
    DocumentRoot /var/www/nexusss

    <Directory /var/www/nexusss>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nexusss_error.log
    CustomLog ${APACHE_LOG_DIR}/nexusss_access.log combined

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com
    DocumentRoot /var/www/nexusss

    <Directory /var/www/nexusss>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    SetEnv DB_HOST localhost
    SetEnv DB_NAME nexus_it
    SetEnv DB_USER nexus_user
    SetEnv DB_PASS change_this_database_password
    SetEnv SMTP_HOST smtp.example.com
    SetEnv SMTP_PORT 587
    SetEnv SMTP_USERNAME mailer@example.com
    SetEnv SMTP_PASSWORD change_this_smtp_password
    SetEnv SMTP_ENCRYPTION tls
    SetEnv MAIL_FROM_EMAIL mailer@example.com
    SetEnv MAIL_FROM_NAME "Nexus IT"
    SetEnv AUTO_SCHEMA_MIGRATE 0
    SetEnv ENABLE_ADMIN_BOOTSTRAP 0
    SetEnv SESSION_SECURE_COOKIE 1

    <Location "/data">
        Require all denied
    </Location>

    <Location "/uploads">
        Require all denied
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/nexusss_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/nexusss_ssl_access.log combined
</VirtualHost>
</IfModule>
