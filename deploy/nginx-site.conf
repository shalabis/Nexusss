server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    root /var/www/nexusss;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5M;

    location /data/ {
        deny all;
    }

    location /uploads/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param DB_HOST localhost;
        fastcgi_param DB_NAME nexus_it;
        fastcgi_param DB_USER nexus_user;
        fastcgi_param DB_PASS change_this_database_password;
        fastcgi_param SMTP_HOST smtp.example.com;
        fastcgi_param SMTP_PORT 587;
        fastcgi_param SMTP_USERNAME mailer@example.com;
        fastcgi_param SMTP_PASSWORD change_this_smtp_password;
        fastcgi_param SMTP_ENCRYPTION tls;
        fastcgi_param MAIL_FROM_EMAIL mailer@example.com;
        fastcgi_param MAIL_FROM_NAME "Nexus IT";
        fastcgi_param AUTO_SCHEMA_MIGRATE 0;
        fastcgi_param ENABLE_ADMIN_BOOTSTRAP 0;
        fastcgi_param SESSION_SECURE_COOKIE 1;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }
}
